runtime: nodejs20
service: cookiemanager-admin

handlers:
  # Sirve archivos estáticos primero
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|json|txt|map))
    static_files: dist/\1
    upload: dist/(.*)
    secure: always

  # Redirige todo lo demás a index.html
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
